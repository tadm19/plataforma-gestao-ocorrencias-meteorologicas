<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
  <style>
    .media-detalhe {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 1rem;
      margin-top: 1.5rem;
      align-items: stretch;
    }

    .media-detalhe.sem-foto {
      grid-template-columns: 1fr;
    }

    .foto-detalhe img {
      width: 100%;
      height: 350px;
      object-fit: cover;
      border-radius: 8px;
    }

    #mapaOcorrencia {
      height: 350px;
      width: 100%;
      border-radius: 8px;
    }

    @media (max-width: 768px) {
      .media-detalhe {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body class="container py-4">
  <div id="auth" class="d-flex gap-2 justify-content-end mb-4"></div>

  <h2>Detalhe</h2>
  <p id="msg" class="mt-3"></p>

  <div id="detalhe" class="mt-3"></div>

  <div id="mediaDetalhe" class="media-detalhe sem-foto">
    <div id="fotoDetalhe" class="foto-detalhe"></div>
    <div id="mapaContainer" class="mapa-detalhe">
      <div id="mapaOcorrencia" class="rounded border"></div>
      <p id="mapaFallback" class="text-muted mt-2"></p>
    </div>
  </div>

  <section id="areaAcoes" class="mt-4 border-top pt-4" style="display: none;">
    <div class="d-flex gap-2">
      <a class="btn btn-primary" id="btnEditar">Editar ocorrencia</a>
      <button class="btn btn-outline-danger" id="btnApagar" type="button">Apagar</button>
    </div>
  </section>

  <script src="js/api.js" defer></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script src="js/detalhes.js" defer></script>
</body>
</html>
