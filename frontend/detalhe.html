<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
  <style>
    #mapaCriacao,
    #mapaEdicao,
    #mapaOcorrencia {
      height: 350px;
      width: 100%;
      border-radius: 8px;
    }
  </style>
</head>
<body class="container py-4">
  <div id="auth" class="d-flex gap-2 justify-content-end mb-4"></div>

  <h2>Detalhe</h2>
  <p id="msg" class="mt-3"></p>

  <div id="detalhe" class="mt-3"></div>
  <div id="mapaContainer" class="mt-4">
    <h3 class="h5">Mapa</h3>
    <div id="mapaOcorrencia" class="rounded border"></div>
    <p id="mapaFallback" class="text-muted mt-2"></p>
  </div>

  <section id="areaEdicao" class="mt-4 border-top pt-4">
    <h3 class="h5">Editar ocorrencia</h3>

    <div class="d-grid gap-3 mt-3">
      <div>
        <label class="form-label" for="tipo">Tipo</label>
        <input class="form-control" id="tipo" required>
      </div>

      <div>
        <label class="form-label" for="descricao">Descricao</label>
        <textarea class="form-control" id="descricao" rows="4" required></textarea>
      </div>

      <div>
        <label class="form-label">Localizacao</label>
        <div id="mapaEdicao" class="border"></div>
        <p class="text-muted mt-2 mb-0" id="localizacaoEdicaoTexto">Clique no mapa para alterar a localização.</p>
        <input id="latitude" type="hidden">
        <input id="longitude" type="hidden">
        <input id="localizacaoTexto" type="hidden">
      </div>

      <div>
        <label class="form-label" for="prioridade">Prioridade</label>
        <select class="form-select" id="prioridade">
          <option value="baixa">Baixa</option>
          <option value="media">Media</option>
          <option value="alta">Alta</option>
          <option value="critica">Critica</option>
        </select>
      </div>

      <div>
        <label class="form-label" for="estado">Estado</label>
        <select class="form-select" id="estado">
          <option value="pendente">Pendente</option>
          <option value="em resolucao">Em resolucao</option>
          <option value="resolvido">Resolvido</option>
          <option value="arquivada">Arquivada</option>
        </select>
      </div>

      <div>
        <label class="form-label" for="imagem">Imagem</label>
        <input class="form-control" type="file" id="imagem" accept="image/*">
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-primary" id="btnAtualizar" type="button">Atualizar</button>
        <button class="btn btn-outline-danger" id="btnApagar" type="button">Apagar</button>
      </div>
    </div>
  </section>

  <script src="js/api.js" defer></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script src="js/detalhes.js" defer></script>
</body>
</html>
