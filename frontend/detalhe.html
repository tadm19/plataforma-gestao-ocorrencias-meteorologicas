<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
  <div id="auth" class="d-flex gap-2 justify-content-end mb-4"></div>

  <h2>Detalhe</h2>
  <p id="msg" class="mt-3"></p>

  <div id="detalhe" class="mt-3"></div>

  <section id="areaEdicao" class="mt-4 border-top pt-4">
    <h3 class="h5">Editar ocorrencia</h3>

    <div class="d-grid gap-3 mt-3">
      <div>
        <label class="form-label" for="tipo">Tipo</label>
        <input class="form-control" id="tipo" required>
      </div>

      <div>
        <label class="form-label" for="descricao">Descricao</label>
        <textarea class="form-control" id="descricao" rows="4" required></textarea>
      </div>

      <div>
        <label class="form-label" for="localizacao">Localizacao</label>
        <input class="form-control" id="localizacao" required>
      </div>

      <div>
        <label class="form-label" for="prioridade">Prioridade</label>
        <select class="form-select" id="prioridade">
          <option value="baixa">Baixa</option>
          <option value="media">Media</option>
          <option value="alta">Alta</option>
        </select>
      </div>

      <div>
        <label class="form-label" for="estado">Estado</label>
        <select class="form-select" id="estado">
          <option value="pendente">Pendente</option>
          <option value="em resolucao">Em resolucao</option>
          <option value="resolvido">Resolvido</option>
        </select>
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-primary" id="btnAtualizar" type="button">Atualizar</button>
        <button class="btn btn-outline-danger" id="btnApagar" type="button">Apagar</button>
      </div>
    </div>
  </section>

  <script src="js/api.js" defer></script>
  <script src="js/detalhes.js" defer></script>
</body>
</html>
