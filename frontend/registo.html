<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
  <div id="auth" class="d-flex gap-2 justify-content-end mb-4"></div>

  <h2>Registo</h2>

  <form id="registoForm" class="mt-3 d-grid gap-3">
    <div>
      <label class="form-label" for="nome">Nome</label>
      <input class="form-control" id="nome" type="text" autocomplete="name" required>
    </div>

    <div>
      <label class="form-label" for="email">Email</label>
      <input class="form-control" id="email" type="email" autocomplete="email" required>
    </div>

    <div>
      <label class="form-label" for="password">Password</label>
      <input class="form-control" id="password" type="password" autocomplete="new-password" minlength="6" required>
    </div>

    <div>
      <label class="form-label" for="confirmarPassword">Confirmar password</label>
      <input class="form-control" id="confirmarPassword" type="password" autocomplete="new-password" minlength="6" required>
    </div>

    <div>
      <label class="form-label" for="idade">Idade</label>
      <input class="form-control" id="idade" type="number" min="1" max="120" required>
    </div>

    <div>
      <label class="form-label" for="telefone">Telefone</label>
      <input class="form-control" id="telefone" type="tel" inputmode="numeric" placeholder="912345681" required>
    </div>

    <div>
      <label class="form-label" for="cidade">Cidade</label>
      <input class="form-control" id="cidade" type="text" autocomplete="address-level2" required>
    </div>

    <button class="btn btn-primary" type="submit">Registar</button>
  </form>

  <p id="msg" class="mt-3"></p>

  <a href="login.html">Ja tenho conta</a>

  <script src="js/api.js" defer></script>
  <script src="js/registo.js" defer></script>
</body>
</html>
