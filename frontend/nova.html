<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Ocorrencia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
  <style>
    #mapaCriacao {
      height: 350px;
      width: 100%;
      border-radius: 8px;
    }
  </style>
</head>
<body class="container py-4">
  <div id="auth" class="d-flex gap-2 justify-content-end mb-4"></div>

  <h2>Nova Ocorrencia</h2>
  <p id="msg" class="mt-3"></p>

  <form id="form" class="mt-3 d-grid gap-3" enctype="multipart/form-data">
    <div>
      <label class="form-label" for="tipo">Tipo</label>
      <input class="form-control" id="tipo" placeholder="Chuva intensa" required>
    </div>

    <div>
      <label class="form-label" for="descricao">Descricao</label>
      <textarea class="form-control" id="descricao" rows="4" required></textarea>
    </div>

    <div>
      <label class="form-label">Localizacao</label>
      <div id="mapaCriacao" class="border"></div>
      <p class="text-muted mt-2 mb-0" id="localizacaoTextoVisivel">Clique no mapa para selecionar a localização.</p>
      <input id="latitude" type="hidden">
      <input id="longitude" type="hidden">
      <input id="localizacaoTexto" type="hidden">
    </div>

    <div>
      <label class="form-label" for="prioridade">Prioridade</label>
      <select class="form-select" id="prioridade" required>
        <option value="baixa">Baixa</option>
        <option value="media" selected>Media</option>
        <option value="alta">Alta</option>
        <option value="critica">Critica</option>
      </select>
    </div>

    <div>
      <label class="form-label" for="imagem">Imagem</label>
      <input class="form-control" type="file" id="imagem" accept="image/*">
    </div>

    <button class="btn btn-primary" type="submit">Submeter</button>
  </form>

  <script src="js/api.js" defer></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script src="js/nova.js" defer></script>
</body>
</html>
