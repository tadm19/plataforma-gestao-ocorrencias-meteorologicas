<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
  <div id="auth" class="d-flex gap-2 justify-content-end mb-4"></div>

  <h2>Login</h2>

  <form id="loginForm" class="mt-3 d-grid gap-3">
    <div>
      <label class="form-label" for="email">Email</label>
      <input class="form-control" id="email" type="email" required>
    </div>

    <div>
      <label class="form-label" for="password">Password</label>
      <input class="form-control" id="password" type="password" required>
    </div>

    <button class="btn btn-primary" type="submit">Entrar</button>
  </form>

  <p id="erro" class="text-danger mt-3"></p>

  <a href="registo.html">Criar conta</a>

  <script src="js/api.js" defer></script>
  <script src="js/auth.js" defer></script>
</body>
</html>
