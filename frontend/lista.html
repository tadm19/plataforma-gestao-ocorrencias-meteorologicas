<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ocorrencias</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
  <div id="auth" class="d-flex gap-2 justify-content-end mb-4"></div>

  <h2>Ocorrencias</h2>
  <p id="msg" class="mt-3"></p>

  <section class="border rounded p-3 mt-3">
    <div class="row g-3 align-items-end">
      <div class="col-md-3">
        <label class="form-label" for="filtroTipo">Tipo</label>
        <input class="form-control" id="filtroTipo" type="text" placeholder="Ex.: chuva">
      </div>
      <div class="col-md-4">
        <label class="form-label" for="filtroCidade">Cidade/localizacao</label>
        <input class="form-control" id="filtroCidade" type="text" placeholder="Ex.: Aveiro">
      </div>
      <div class="col-md-3">
        <label class="form-label" for="filtroData">Data</label>
        <input class="form-control" id="filtroData" type="date">
      </div>
      <div class="col-md-2 d-flex gap-2">
        <button class="btn btn-primary w-100" id="btnFiltrar" type="button">Filtrar</button>
        <button class="btn btn-outline-secondary w-100" id="btnLimparFiltros" type="button">Limpar</button>
      </div>
    </div>
  </section>

  <div class="table-responsive mt-3">
    <table class="table table-striped align-middle">
      <thead>
        <tr>
          <th>Tipo</th>
          <th>Descricao</th>
          <th>Local</th>
          <th>Prioridade</th>
          <th>Criada por</th>
          <th>Data</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tabela"></tbody>
    </table>
  </div>

  <script src="js/api.js" defer></script>
  <script src="js/lista.js" defer></script>
</body>
</html>
