<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestao de Ocorrencias Meteorologicas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
  <div id="auth" class="d-flex gap-2 justify-content-end mb-4"></div>

  <header class="mb-4">
    <h1 class="h2">Gestao de Ocorrencias Meteorologicas</h1>
    <p class="text-muted mb-3">
      Plataforma para registar, acompanhar e consultar ocorrencias meteorologicas com localizacao, imagens e estado de resolucao.
    </p>

    <div id="acoesInicio" class="d-flex flex-wrap gap-2"></div>
  </header>

  <section class="mt-4">
    <div class="d-flex justify-content-between align-items-center gap-3 mb-3">
      <h2 class="h4 mb-0">Ocorrencias recentes</h2>
      <a class="btn btn-outline-primary btn-sm" href="lista.html">Ver todas</a>
    </div>

    <p id="msg" class="mt-3"></p>
    <div id="recentes" class="row g-3"></div>
  </section>

  <script src="js/api.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
